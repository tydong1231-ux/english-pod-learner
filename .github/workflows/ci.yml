name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium

      - name: Mobile playback, progress and vocabulary regression tests
        run: |
          npm run preview -- --config vite.web.config.js --host 127.0.0.1 --port 4173 --strictPort &
          npx wait-on http://127.0.0.1:4173
          npm run test:browser

      - name: Keep browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-screenshots
          path: artifacts/
          if-no-files-found: ignore
